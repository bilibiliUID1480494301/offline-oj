name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "PySide6>=6.6,<7" "psutil>=5.9" pytest
      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -o addopts= -q
