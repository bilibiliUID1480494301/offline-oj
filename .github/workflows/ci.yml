name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install dependencies
        run: pip install "PySide6>=6.6,<7" "psutil>=5.9" pytest pytest-timeout
      - name: Run logic tests (offscreen)
        # CI 聚焦纯逻辑回归（数据/协议/算法/判题）。Qt 重 UI 测试与真实
        # 回环网络测试在本地跑（tools/pytest_stability.py + offscreen 全量）。
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests -o addopts= -q --timeout=120 --timeout-method=signal \
            --ignore=tests/smoke_gui.py \
            --ignore=tests/test_code_editor.py \
            --ignore=tests/test_completion.py \
            --ignore=tests/test_exam_code_view.py \
            --ignore=tests/test_exam_settings.py \
            --ignore=tests/test_export_ui.py \
            --ignore=tests/test_net_lan.py \
            --ignore=tests/test_similarity_ui.py \
            --ignore=tests/test_ui_dedup.py \
            --ignore=tests/test_ui_shortcuts.py \
            --ignore=tests/test_ui_theme.py
